<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<title>SaludUni</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f7;--card:#fff;--tx:#0f172a;--mut:#64748b;--navy:#1e3a8a;--teal:#0d9488;--tint:#e6f6f3;--bd:#e2e8f0;--red:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#162033;--tx:#e8edf6;--mut:#94a3b8;--navy:#3b5bc4;--tint:#10332f;--bd:#27344d;--teal:#0f9488}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:84px;position:relative}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
.top h2{margin:0;font-size:18px;flex:1;text-align:center}.top .sp{width:40px}
.bk{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px}
.pad{padding:16px}h3{margin:18px 0 8px;font-size:16px}.mut{color:var(--mut);font-size:12px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,23,42,.07)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.sb{justify-content:space-between}
.btn{width:100%;border:0;border-radius:16px;padding:16px;font:800 15px Inter,sans-serif;color:#fff;background:var(--navy);cursor:pointer}
.btn.t{background:var(--teal)}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600}.btn.r{background:var(--card);color:var(--red);border:1px solid var(--bd)}
.btn:disabled{opacity:.45}.sm{width:auto;padding:8px 12px;font-size:12px;border-radius:10px}
input,select{width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;padding:9px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13px Inter,sans-serif}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--tint);color:var(--teal);position:relative;flex:none}
.pro{cursor:pointer}.pro b{font-size:14px}
.tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--teal)}.tag.x{background:#fee2e2;color:var(--red)}.tag.d{background:#e0e7ff;color:var(--navy)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cal i{font-style:normal;color:var(--mut);font-size:11px;padding:4px}
.cal button{aspect-ratio:1;border:0;border-radius:50%;background:none;color:var(--tx);font:600 13px Inter,sans-serif}.cal button:disabled{color:var(--mut);opacity:.4}.cal button.on{background:var(--navy);color:#fff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:12px 0;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:700 13px Inter,sans-serif}.slot.on{background:var(--teal);color:#fff;border-color:var(--teal)}.slot:disabled{text-decoration:line-through;opacity:.4}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);z-index:6}
.nav{display:flex;justify-content:space-around}.nav button{border:0;background:none;color:var(--mut);font:600 11px Inter,sans-serif;padding:4px 10px;display:grid;gap:2px;justify-items:center}.nav button.on{color:var(--teal)}.nav span{font-size:20px}
.hero{background:var(--teal);color:#fff;padding:18px 20px 26px;border-radius:0 0 26px 26px}.hero h1{margin:0;font-size:24px}
.ok{width:76px;height:76px;border-radius:50%;background:var(--teal);color:#fff;font-size:38px;display:grid;place-items:center;margin:8px auto}
.qr{display:grid;grid-template-columns:repeat(9,1fr);width:92px;height:92px;gap:1px;background:#fff;padding:5px;border-radius:8px}.qr b{background:#fff}.qr b.k{background:#111}
.login{padding:48px 24px 24px}.logo{font:800 30px Inter,sans-serif;text-align:center;margin:12px 0 4px}.logo u{text-decoration:none;color:var(--teal)}
.big{font:800 34px/1.1 Inter,sans-serif;text-align:center;margin:36px 0 8px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:20}
</style></head><body><div id="app"></div>
<script>
const $=id=>document.getElementById(id),e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rng=(a,b)=>{let r=[];for(let m=a;m<=b;m+=30)r.push(String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));return r};
const SH={Mañana:rng(480,690),Tarde:rng(840,1050),Noche:rng(1080,1230)};
let DB={specs:[],pros:[],apps:[],users:[]},TOK=null;try{TOK=localStorage.getItem('su_tok')}catch(x){}
async function api(p,b){try{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',...(TOK?{'X-Token':TOK}:{})},body:b?JSON.stringify(b):undefined});let j=null;try{j=await r.json()}catch(x){}if(!r.ok||!j){if(r.status==401&&TOK){logout(true);return null}toast(j&&j.error?j.error:'Esta página no está conectada a server.py (código '+r.status+'). Ejecutá server.py y abrí http://127.0.0.1:8000');return null}return j}catch(x){toast('No hay conexión con server.py. ¿Está ejecutándose? Abrí http://127.0.0.1:8000');return null}}
async function sync(){const j=await api('state');if(!j)return false;DB=j;S.user=j.user;return true}
const landing=r=>r=='Médico'?'agenda':r=='Administrador'?'aturnos':'home';
const land=()=>S.user.must_change?"pw":landing(S.user.role);
async function boot(){if(TOK&&await sync())go(land());else render()}

const S={s:'login',role:'Alumno',spec:0,pid:null,date:null,time:null,re:null,cm:0,user:null,tab:'t'};
const ROLES=['Alumno','Profesor','Médico','Administrador'];
const P=id=>DB.pros.find(p=>p.id==id)||{name:'(eliminado)',spec:'',shift:''};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=(s,o)=>new Date(s+'T12:00').toLocaleDateString('es',o||{weekday:'long',day:'numeric',month:'long'});
const free=(pid,d,t)=>!DB.apps.some(a=>a.pid==pid&&a.date==d&&a.time==t&&a.st=='activo'&&a.id!=S.re);
const end=t=>{let m=+t.slice(0,2)*60+ +t.slice(3)+30;return String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function next(p){const n=new Date();for(let i=0;i<30;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i);if(d.getDay()==0)continue;for(const t of SH[p.shift]){if(i==0&&t<=n.toTimeString().slice(0,5))continue;if(free(p.id,iso(d),t))return(i==0?'Hoy':i==1?'Mañana':fd(iso(d),{weekday:'short',day:'numeric',month:'short'}))+', '+t}}return'Sin turnos'}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function go(s,x){Object.assign(S,x||{},{s});if(s!="ausers")S.tmp=null;render();scrollTo(0,0)}
const hdr=(t,b)=>`<div class=top>${b?`<button class=bk aria-label="Volver" onclick="${b}">‹</button>`:'<span class=sp></span>'}<h2>${t}</h2><span class=sp></span></div>`;
const ini=n=>n.replace(/^(Dra?\.|Lic\.)\s*/,'').split(' ').map(w=>w[0]).join('').slice(0,2);
function nav(items){return`<div class=bar><div class=nav>${items.map(([k,i,l,a])=>`<button class="${a?'on':''}" onclick="${k}"><span>${i}</span>${l}</button>`).join('')}</div></div>`}
const pnav=a=>nav([["go('home')",'🏠','Inicio',a=='h'],["go('mine')",'📅','Mis Turnos',a=='m'],["go('prof')",'👤','Perfil',a=='p']]);
function card(a,act){const p=P(a.pid),q=a.st=='activo'?'':a.st=='atendido'?'d':'x';return`<div class=card><div class="row sb"><span class="tag ${q}">${a.st.toUpperCase()}</span><span class=mut>#${e(a.id)}</span></div><div class=row style="margin-top:12px"><div class=grow><div class=mut>${e(p.spec)}</div><b>${e(p.name)}</b>${a.uname?`<div class=mut>Paciente: ${e(a.uname)} (${e(a.role)})</div>`:''}<div class=mut style="margin-top:6px">📅 ${fd(a.date,{weekday:'short',day:'numeric',month:'long'})}<br>🕐 ${a.time} — ${end(a.time)}<br>📍 Centro de Salud Universitario</div></div>${act=='qr'?qr(a.id):''}</div></div>`}
function qr(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;let o='';for(let i=0;i<81;i++){h=(h*1103515245+12345)>>>0;o+=`<b class="${(h>>16)&1?'k':''}"></b>`}return`<div class=qr aria-label="Código QR">${o}</div>`}
const V={
login(){return`<div class=login><div class=logo>SALUD<u>UNI</u></div><div class="mut" style="text-align:center">Bienestar universitario</div><div class=big>Tu salud,<br>en un click</div><p class=mut style="text-align:center;font-size:14px">Reservá una consulta con profesionales de la universidad en menos de 2 minutos.</p><div style="margin-top:28px">${S.reg?`<div class=chips style="margin-bottom:10px">${['Alumno','Profesor'].map(r=>`<button class="chip ${S.role==r?'on':''}" onclick="S.role='${r}';render()">${r}</button>`).join('')}</div>`:''}<input id=lid placeholder="Cédula o correo institucional" autocomplete=username><input id=lpw type=password placeholder="Contraseña" autocomplete=current-password><button class=btn onclick=login()>${S.reg?'Crear cuenta':'Ingresar'}</button><button class="btn g" style="margin-top:10px" onclick="S.reg=!S.reg;S.role='Alumno';render()">${S.reg?'Ya tengo cuenta':'Crear cuenta nueva'}</button></div></div>`},
home(){const q=(S.q||'').toLowerCase();return hdr('Reservar Turno')+`<div class=pad><input id=q placeholder="🔍 Buscar especialidad o profesional" oninput="S.q=this.value;$('lst').innerHTML=lst()" value="${e(S.q||'')}"><h3 style="margin-top:6px">Especialidades</h3><div class=chips>${DB.specs.map((s,i)=>`<button class="chip ${S.spec==i&&!q?'on':''}" onclick="S.q='';go('home',{spec:${i}})">${e(s)}</button>`).join('')}</div><h3>Profesionales disponibles</h3><div id=lst>${lst()}</div></div>`+pnav('h')},
date(){const p=P(S.pid),b=new Date(),m=new Date(b.getFullYear(),b.getMonth()+S.cm,1),n=(new Date(m.getFullYear(),m.getMonth()+1,0)).getDate(),off=(m.getDay()+6)%7,td=iso(b),lim=iso(new Date(b.getFullYear(),b.getMonth(),b.getDate()+60));let c='';for(let i=0;i<off;i++)c+='<span></span>';for(let d=1;d<=n;d++){const x=new Date(m.getFullYear(),m.getMonth(),d),k=iso(x),dis=k<td||k>lim||x.getDay()==0;c+=`<button ${dis?'disabled':''} class="${S.date==k?'on':''}" onclick="S.date='${k}';S.time=null;render()">${d}</button>`}
const nowT=new Date().toTimeString().slice(0,5);const sl=S.date?SH[p.shift].map(t=>{const bad=!free(p.id,S.date,t)||(S.date==td&&t<=nowT);return`<button class="slot ${S.time==t?'on':''}" ${bad?'disabled':''} onclick="S.time='${t}';render()">${t}</button>`}).join(''):'';
return hdr('Fecha y Hora',"go(S.re?'mine':'home')")+`<div class=pad><div class=card style="border-left:4px solid var(--teal)"><div class=mut>CONSULTA CON</div><b>${e(p.name)}</b><div class=mut>${e(p.spec)} · 30 min · Turno ${p.shift.toLowerCase()}</div></div><h3>Seleccioná una fecha</h3><div class=card><div class="row sb" style="margin-bottom:8px"><button class=bk ${S.cm<=0?'disabled':''} onclick="S.cm--;render()">‹</button><b>${m.toLocaleDateString('es',{month:'long',year:'numeric'})}</b><button class=bk ${S.cm>=2?'disabled':''} onclick="S.cm++;render()">›</button></div><div class=cal>${'LMMJVSD'.split('').map(x=>`<i>${x}</i>`).join('')}${c}</div></div>${S.date?`<h3>Horarios disponibles · turno ${p.shift.toLowerCase()}</h3><div class=slots>${sl}</div>`:'<p class=mut>Elegí un día para ver los horarios.</p>'}</div><div class=bar><div class="row sb mut" style="margin-bottom:8px"><span>Tu selección</span><b style="color:var(--tx)">${S.date&&S.time?fd(S.date,{weekday:'short',day:'numeric',month:'short'})+' · '+S.time:'—'}</b></div><button class=btn ${S.date&&S.time?'':'disabled'} onclick="go('conf')">Continuar ›</button></div>`},
conf(){const p=P(S.pid);const r=(i,l,v,s)=>`<div class=row style="margin:12px 0"><div class=av style="width:40px;height:40px">${i}</div><div><div class=mut>${l}</div><b>${v}</b>${s?`<div class=mut>${s}</div>`:''}</div></div>`;return hdr('Confirmar Turno',"go('date')")+`<div class=pad><div class=ok>✓</div><h2 style="text-align:center;margin:4px">Todo listo para confirmar</h2><p class=mut style="text-align:center;font-size:14px">Revisá los datos de tu turno antes de reservar.</p><div class=card><b>Resumen de la consulta</b><hr style="border:0;border-top:1px solid var(--bd)">${r('👤','Profesional',e(p.name),e(p.spec))}${r('📅','Fecha',fd(S.date))}${r('🕐','Horario',S.time+' — '+end(S.time))}${r('📍','Ubicación','Centro de Salud Universitario','Consultorio '+(200+DB.pros.indexOf(p)+1)+' · Piso 2')}</div><div class=card style="background:var(--tint)"><b style="font-size:12px;color:var(--teal)">Cancelación sin cargo</b><div class=mut>Podés cancelar hasta 2 horas antes.</div></div></div><div class=bar><button class="btn t" onclick=book()>✓ ${S.re?'Confirmar cambio':'Confirmar Reserva'}</button></div>`},
done(){const a=DB.apps.find(x=>x.id==S.last);return`<div class=hero><h1>Mis Turnos</h1><div style="font-size:12px;opacity:.9">Tu agenda de salud</div></div><div class=pad><div class=ok>✓</div><h2 style="text-align:center;margin:4px">¡Turno Reservado!</h2><p class=mut style="text-align:center;font-size:14px">Confirmación registrada para ${e(S.user.id)}.</p>${card(a,'qr')}<p class=mut style="text-align:center">Llegá 10 minutos antes para registrarte.</p><button class="btn g" onclick="go('home')">Reservar otro turno</button></div>`+pnav('m')},
mine(){const L=DB.apps.filter(a=>a.uid==S.user.id).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return`<div class=hero><h1>Mis Turnos</h1><div style="font-size:12px;opacity:.9">Tu agenda de salud</div></div><div class=pad>${L.length?L.map(a=>card(a,'qr')+(a.st=='activo'?`<div class=row style="margin:-4px 0 14px"><button class="btn g" onclick="resched('${a.id}')">Reprogramar</button><button class="btn r" onclick="setSt('${a.id}','cancelado')">Cancelar</button></div>`:'')).join(''):'<div class=card style="text-align:center"><p>Todavía no tenés turnos.</p><button class="btn t" onclick="go(\'home\')">Reservar un turno</button></div>'}</div>`+pnav('m')},
prof(){const u=S.user;return hdr('Perfil')+`<div class=pad><div class=card><div class=row><div class=av>${e(u.id.slice(0,2).toUpperCase())}</div><div><b>${e(u.id)}</b><div class=mut>${u.role}${u.pid?' · '+e(P(u.pid).name):''}</div></div></div></div>${pwForm()}<button class="btn r" onclick="logout()">Cerrar sesión</button></div>`+(u.role=='Médico'?dnav('p'):u.role=='Administrador'?anav('p'):pnav('p'))},
agenda(){const L=DB.apps.filter(a=>a.pid==S.user.pid).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return`<div class=hero><h1>Mi agenda</h1><div style="font-size:12px;opacity:.9">${e(P(S.user.pid).name)} · turno ${P(S.user.pid).shift.toLowerCase()}</div></div><div class=pad>${L.length?L.map(a=>card(a)+(a.st=='activo'?`<div class=row style="margin:-4px 0 14px"><button class="btn t" onclick="setSt('${a.id}','atendido')">Marcar atendido</button><button class="btn r" onclick="setSt('${a.id}','cancelado')">Cancelar</button></div>`:'')).join(''):'<p class=mut>No tenés turnos reservados.</p>'}</div>`+dnav('a')},
aturnos(){const L=[...DB.apps].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return hdr('Todos los turnos')+`<div class=pad>${L.length?L.map(a=>card(a)+(a.st=='activo'?`<button class="btn r sm" style="margin:-4px 0 14px" onclick="setSt('${a.id}','cancelado')">Cancelar turno</button>`:'')).join(''):'<p class=mut>Sin turnos todavía.</p>'}</div>`+anav('t')},
apros(){return hdr('Profesionales')+`<div class=pad><div class=card><b>Agregar profesional</b><input id=an placeholder="Nombre (ej. Dra. Ana Pérez)"><select id=as>${DB.specs.map(s=>`<option>${e(s)}</option>`).join('')}</select><select id=ah>${Object.keys(SH).map(s=>`<option>${s}</option>`).join('')}</select><button class="btn t" onclick=addPro()>Agregar</button></div>${DB.pros.map(p=>`<div class="card row"><div class=av>${e(ini(p.name))}</div><div class=grow><b>${e(p.name)}</b><div class=mut>${e(p.spec)} · ${p.shift}</div></div><button class="btn r sm" onclick="delPro('${p.id}')">Quitar</button></div>`).join('')}</div>`+anav('p2')},
aesp(){return hdr('Especialidades')+`<div class=pad><div class=card><b>Nueva especialidad</b><input id=ns placeholder="Ej. Kinesiología"><button class="btn t" onclick=addSpec()>Agregar</button></div>${DB.specs.map(s=>`<div class="card row"><b class=grow>${e(s)}</b><span class=mut>${DB.pros.filter(p=>p.spec==s).length} prof.</span><button class="btn r sm" onclick="delSpec(${DB.specs.indexOf(s)})">Quitar</button></div>`).join('')}</div>`+anav('e')},
pw(){return hdr('Nueva contraseña')+`<div class=pad><div class=card><b>Elegí tu contraseña</b><p class=mut>Por seguridad, tenés que cambiar la contraseña temporal antes de continuar.</p>${pwFields()}<button class="btn t" onclick=changePw()>Guardar y continuar</button></div><button class="btn r" onclick="logout()">Cerrar sesión</button></div>`},
ausers(){return hdr('Usuarios')+`<div class=pad>${S.tmp?`<div class=card style="background:var(--tint)"><b>Contraseña temporal de ${e(S.tmp.id)}</b><div style="font:800 24px Inter,sans-serif;letter-spacing:2px;margin:8px 0;user-select:all">${e(S.tmp.password)}</div><div class=mut>Pasásela al usuario: tendrá que cambiarla al ingresar. No se vuelve a mostrar.</div><button class="btn g sm" style="margin-top:10px" onclick="S.tmp=null;render()">Cerrar</button></div>`:''}<div class=card><b>Crear usuario</b><input id=ui placeholder="Cédula o correo"><input id=up type=password placeholder="Contraseña inicial (mínimo 6)"><select id=ur><option>Médico</option><option>Administrador</option><option>Alumno</option><option>Profesor</option></select><select id=upr>${DB.pros.map(p=>`<option value="${e(p.id)}">${e(p.name)} (solo si es médico)</option>`).join('')}</select><button class="btn t" onclick=addUser()>Crear usuario</button></div>${DB.users.map((u,i)=>`<div class=card><div class=grow><b>${e(u.id)}</b><div class=mut>${e(u.role)}${u.pid?' · '+e(P(u.pid).name):''}</div></div>${u.id==S.user.id?'':`<div class=row style="margin-top:10px"><button class="btn g sm" onclick="resetUser(${i})">Restablecer contraseña</button><button class="btn r sm" onclick="delUser(${i})">Quitar</button></div>`}</div>`).join('')}</div>`+anav('u')}
};
const dnav=a=>nav([["go('agenda')",'📋','Agenda',a=='a'],["go('prof')",'👤','Perfil',a=='p']]);
const anav=a=>nav([["go('aturnos')",'📅','Turnos',a=='t'],["go('apros')",'🩺','Profesionales',a=='p2'],["go('aesp')",'🏷️','Especialidades',a=='e'],["go('ausers')",'👥','Usuarios',a=='u'],["go('prof')",'👤','Perfil',a=='p']]);
function lst(){const q=(S.q||'').toLowerCase().trim();const L=q?DB.pros.filter(p=>(p.name+p.spec).toLowerCase().includes(q)):DB.pros.filter(p=>p.spec==DB.specs[S.spec]);if(!L.length)return'<p class=mut>No hay profesionales para esa búsqueda.</p>';return`<div class=mut style="margin-bottom:8px">${L.length} profesionales con turnos próximos</div>`+L.map(p=>`<div class="card row pro" onclick="pick('${p.id}')"><div class=av>${e(ini(p.name))}</div><div class=grow><b>${e(p.name)}</b><div class=mut>${e(p.spec)} · ${p.shift}</div><div style="font-size:12px;font-weight:600;color:var(--teal);margin-top:4px">🕐 Próximo: ${next(p)}</div></div><span class=mut>›</span></div>`).join('')}
function pick(id){S.pid=id;S.date=null;S.time=null;S.re=null;S.cm=0;go('date')}
function resched(id){const a=DB.apps.find(x=>x.id==id);S.re=id;S.pid=a.pid;S.date=null;S.time=null;S.cm=0;go('date')}
async function login(){const id=$('lid').value.trim(),pw=$('lpw').value;if(!id||!pw)return toast('Completá usuario y contraseña');const j=await api(S.reg?'register':'login',{id,password:pw,role:S.role});if(!j)return;TOK=j.token;try{localStorage.setItem('su_tok',TOK)}catch(x){}if(await sync())go(land())}
function logout(q){if(TOK&&!q)api('logout',{});TOK=null;try{localStorage.removeItem('su_tok')}catch(x){}S.user=null;DB={specs:[],pros:[],apps:[],users:[]};go('login');if(q)toast('Tu sesión venció, ingresá de nuevo')}
async function book(){const j=await api('book',{pid:S.pid,date:S.date,time:S.time,re:S.re});if(!j){await sync();return go('date')}S.last=j.id;S.re=null;await sync();go('done')}
async function setSt(id,st){if(!await api('status',{id,st}))return;await sync();toast(st=='cancelado'?'Turno cancelado':'Turno marcado como atendido');render()}
async function addPro(){const n=$('an').value.trim();if(!n)return toast('Escribí el nombre del profesional');if(await api('pro',{name:n,spec:$('as').value,shift:$('ah').value})){await sync();toast('Profesional agregado');render()}}
async function delPro(id){if(await api('pro/del',{id})){await sync();render()}}
async function addSpec(){const n=$('ns').value.trim();if(!n)return toast('Escribí un nombre nuevo');if(await api('spec',{name:n})){await sync();render()}}
async function delSpec(i){if(await api('spec/del',{name:DB.specs[i]})){S.spec=0;await sync();render()}}
async function addUser(){const o={id:$('ui').value.trim(),password:$('up').value,role:$('ur').value,pid:$('upr').value};if(!o.id||!o.password)return toast('Completá usuario y contraseña');if(await api('user',o)){await sync();toast('Usuario creado. Deberá cambiar su contraseña al ingresar.');render()}}
async function delUser(i){if(await api('user/del',{id:DB.users[i].id})){await sync();render()}}
const pwFields=()=>`<input id=pw0 type=password placeholder="Contraseña actual (o temporal)" autocomplete=current-password><input id=pw1 type=password placeholder="Contraseña nueva (mínimo 6)" autocomplete=new-password><input id=pw2 type=password placeholder="Repetí la contraseña nueva" autocomplete=new-password>`;
const pwForm=()=>`<div class=card><b>Cambiar contraseña</b><div style="height:8px"></div>${pwFields()}<button class="btn t" onclick=changePw()>Cambiar contraseña</button></div>`;
async function changePw(){const o=$('pw0').value,n=$('pw1').value;if(!o||!n)return toast('Completá todos los campos');if(n!=$('pw2').value)return toast('Las contraseñas nuevas no coinciden');const j=await api('password',{old:o,new:n});if(!j)return;TOK=j.token;try{localStorage.setItem('su_tok',TOK)}catch(x){}await sync();toast('Contraseña cambiada');go(S.s=='pw'?land():'prof')}
async function resetUser(i){const u=DB.users[i],j=await api('user/reset',{id:u.id});if(j){S.tmp={id:u.id,password:j.password};render()}}
function render(){$('app').innerHTML=V[S.s]()}
boot();
</script></body></html>
