name: CI (Integración Continua)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar que el código compila
        run: python -m py_compile saluduni1.2/server.py saluduni1.2/app_wsgi.py

      - name: Verificar que no se subieron bases de datos
        run: |
          if git ls-files | grep -E '\.db$'; then
            echo "::error::Hay archivos .db en el repositorio. Pueden contener datos personales: quitalos."
            exit 1
          fi

      - name: Ejecutar pruebas automáticas
        run: python -m unittest discover -s tests -v
