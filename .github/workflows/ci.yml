name: CI (Integración Continua)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar documentación
        run: echo "✅ El repositorio se ha descargado correctamente. Pipeline ejecutado."

